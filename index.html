function parse(){
  const h=location.hash.slice(1);
  let m=/^day-(\d{4}-\d{2}-\d{2})$/.exec(h);if(m&&m[1]<=todayKey)return{v:'day',k:m[1],menu:'notebook'};
  m=/^start-(\d{4}-\d{2}-\d{2})$/.exec(h);if(m&&m[1]<=todayKey)return{v:'start',k:m[1],menu:'notebook'};
  m=/^end-(\d{4}-\d{2}-\d{2})$/.exec(h);if(m&&m[1]<=todayKey)return{v:'end',k:m[1],menu:'notebook'};
  m=/^week-(\d{4}-W\d{2})$/.exec(h);if(m)return{v:'week',wk:m[1],menu:'notebook'};
  m=/^note-([a-z0-9]+)$/.exec(h);if(m&&ST.notes[m[1]])return{v:'note',id:m[1],menu:'notebook'};
  m=/^trade-(\d{4}-\d{2}-\d{2})-(\d+)$/.exec(h);if(m&&ST.days[m[1]]?.trades?.[+m[2]-1])return{v:'trade',k:m[1],j:+m[2],menu:'notebook'};
  if(/^news/.test(h))return{v:'news',menu:'news'};
  m=/^settings(?:-(rules|playbook|routine|templates|data))?$/.exec(h);if(m)return{v:'settings',tab:m[1]||'profile',menu:'settings'};
  return{v:'menu',menu:MENUS.some(x=>x[0]===h)?h:'dashboard'};
}
let cur=null,lastView='';
function render(){
  const p=parse(),c=document.getElementById('content');cur=p;
  document.getElementById('nav').innerHTML=MENUS.map(([k,l,i])=>`<li><a class="item" href="#${k}" title="${l}" ${k===p.menu?'aria-current="page"':''}>${i}<span class="lab">${l}</span></a></li>`).join('');
  let title,top=MENUBTN,right=`<span class="date">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span><a href="#dashboard" class="tmark" aria-label="NQ Desk home">${MARK}</a>`;
  if(p.v==='day'){title=fmt(p.k,{weekday:'long',day:'numeric',month:'long',year:'numeric'});c.innerHTML=notebook(dayPage(p.k),'day','d:'+p.k)}
  else if(p.v==='week'){title='Weekly Review · Week '+(+p.wk.split('-W')[1]);c.innerHTML=notebook(weekPage(p.wk),'week','w:'+p.wk)}
  else if(p.v==='note'){title=ST.notes[p.id].title||'Untitled note';c.innerHTML=notebook(notePage(p.id),'note','n:'+p.id)}
  else if(p.v==='trade'){title=`Trade ${p.j} · ${fmt(p.k,{weekday:'short',day:'numeric',month:'short'})}`;top+=BACK('day-'+p.k,'Back to the day');c.innerHTML=notebook(tradePage(p.k,p.j),'trade','t:'+p.k+'|'+ST.days[p.k].trades[p.j-1].id)}
  else if(p.v==='news'){title='News';c.innerHTML=newsView()}
  else if(p.v==='settings'){title='Settings';c.innerHTML=settingsView(p.tab)}
  else if(p.v==='end'){title='End my day · '+fmt(p.k,{weekday:'long',day:'numeric',month:'long'});top+=BACK('day-'+p.k,'Back to the day');c.innerHTML=endPage(p.k)}
  else if(p.v==='start'){title='Start my day · '+fmt(p.k,{weekday:'long',day:'numeric',month:'long'});top+=BACK('notebook','Back to the notebook');right=`<button type="button" class="btn sm" data-wclose>Close</button>`;if(!WZ||WZ.k!==p.k)initWizard(p.k);c.innerHTML=wizardPage()}
  else{const m=MENUS.find(x=>x[0]===p.menu);title=m[1];
    if(p.menu==='dashboard')c.innerHTML=dashboard()
    else if(p.menu==='performance')c.innerHTML=perfView()
    else if(p.menu==='accounts')c.innerHTML=acctView()
    else if(p.menu==='notebook')c.innerHTML=notebook(null,'',null)
    else c.innerHTML=`<div class="empty"><div><b>${m[1]} is empty</b><p>This is where the content we define for this section goes.</p></div></div>`}
  document.getElementById('topl').innerHTML=top+`<h1>${esc(title)}</h1>`;
  document.getElementById('sideprof').innerHTML=sideProfile();
  document.getElementById('topr').innerHTML=right;
  document.getElementById('menubtn').onclick=()=>{if(matchMedia('(max-width:760px)').matches){app.classList.add('open');scrim.hidden=false;return}app.classList.toggle('noside');try{localStorage.setItem('nqd-noside',app.classList.contains('noside')?'1':'0')}catch(e){}};
  mountEditors();applyNbQ();
  const key=location.hash;if(key!==lastView){c.scrollTop=0;lastView=key;document.title=(p.v==='menu'&&p.menu==='dashboard'?'':title+' · ')+'NQ Desk'}
  closeMenu();if(window.NQ_AFTER)NQ_AFTER();
}
function closeMenu(){app.classList.remove('open');scrim.hidden=true}
function rerenderKeepScroll(){const c=document.getElementById('content'),y=c.scrollTop;render();c.scrollTop=y}

const te=new TextEncoder(),td=new TextDecoder();
const b64e=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(s)};

async function unlockKeys(pw){
  const K=await fetch('./keys.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('keys '+r.status);return r.json()});
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);

  const bits=await crypto.subtle.deriveBits({name:'ECDH',public:await crypto.subtle.importKey('jwk',K.pub,{name:'ECDH',namedCurve:'P-256'},false,[])},PRIV,256);
