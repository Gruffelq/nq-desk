<title>NQ Desk</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NQ Desk">
<style>
:root{
  /* Plain dark site: black page, soft grey surfaces without borders, big bold type, blue only for actions, green/red only for outcomes */
  --canvas:#0f0f0f;
  --panel:#1a1a1a;
  --panel-2:#232323;
  --hover:#242424;
  --line:#2a2a2a;
  --line-2:#383838;
  --text:#d1d1d1;
  --hi:#ffffff;
  --muted:#8c8c8c;
  --accent:#2962ff;
  --accent-2:#5b8cff;
  --accent-soft:rgba(41,98,255,.14);
  --good:#22ab94; --good-hi:#22ab94; --good-soft:rgba(34,171,148,.13);
  --warn:#ff9800; --warn-soft:rgba(255,152,0,.13);
  --bad:#f7525f;  --bad-soft:rgba(247,82,95,.13);
  --font:-apple-system,BlinkMacSystemFont,'Trebuchet MS',Roboto,Ubuntu,'Segoe UI',sans-serif;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:#333 transparent}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.app.mini{grid-template-columns:64px minmax(0,1fr)}

/* Sidebar */
.side{background:var(--canvas);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:18px 12px;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;height:36px}
.mark{flex:none;width:30px;height:30px;display:block}
.name{font-weight:700;font-size:18px;color:var(--hi);letter-spacing:-.02em;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px;list-style:none}
.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap;transition:background .1s,color .1s}
.item:hover{color:var(--hi)}
.item[aria-current="page"]{background:var(--panel);color:var(--hi)}
.item svg{flex:none;width:20px;height:20px}
.foot{margin-top:auto}
.collapse{width:100%;justify-content:flex-start;font-weight:500;font-size:14px}
.app.mini .name,.app.mini .lab{display:none}
.app.mini .brand,.app.mini .item{justify-content:center;padding-left:0;padding-right:0}
.app.mini .collapse svg{transform:rotate(180deg)}

/* Top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 32px;flex:none}
.top-l,.top-r{display:flex;align-items:center;gap:12px;min-width:0}
.top h1{font-size:20px;font-weight:700;color:var(--hi);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{color:var(--muted);font-size:14px;white-space:nowrap}
.canvas{flex:1;overflow-y:auto;padding:4px 32px 40px}
.empty{height:100%;min-height:300px;border-radius:var(--r);background:var(--panel);display:grid;place-items:center;text-align:center;padding:24px}
.empty p{color:var(--muted);max-width:44ch}
.empty b{display:block;color:var(--hi);font-size:17px;font-weight:700;margin-bottom:4px}
.back{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--muted);background:var(--panel);flex:none}
.back:hover{color:var(--hi)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;color:var(--hi);background:var(--panel-2);white-space:nowrap;transition:background .1s}
.btn:hover{background:#2e2e2e}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#1e53e5}
.btn.done{background:var(--panel-2);color:var(--good)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:16px;height:16px}
.link{color:var(--accent-2);font-weight:600}
.link:hover{text-decoration:underline}

/* Surfaces */
.dash{display:flex;flex-direction:column;gap:16px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr);gap:16px}
.card{background:var(--panel);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.card-h h2{font-size:16px;font-weight:700;color:var(--hi);letter-spacing:-.01em}
.info{display:none}
.ph{flex:1;min-height:170px;display:grid;place-items:center;color:#5c5c5c;font-size:14px}
.demo{font-size:12px;font-weight:600;color:var(--warn)}

/* Metrics */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.kpi{background:var(--panel);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-l{font-size:14px;color:var(--muted);font-weight:500}
.kpi-v{font-size:30px;font-weight:700;color:var(--hi);letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:15px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi-v.muted{color:#4a4a4a}
.kpi-s{font-size:13px;color:var(--muted)}
.kpi.hero .kpi-v{color:var(--good)}
.dots{display:flex;gap:3px;margin-top:8px}
.dots i{flex:1;max-width:14px;height:4px;border-radius:2px;background:#333}
.dots i.w{background:var(--good)} .dots i.l{background:var(--bad)}

/* Labels */
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.pill.win{color:var(--good)}
.pill.loss{color:var(--bad)}
.pill.warn{color:var(--warn)}
.startbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:6px 0 4px}
.startbar div{display:flex;flex-direction:column}
.startbar b{font-size:26px;font-weight:700;color:var(--hi);letter-spacing:-.02em}
.startbar span{font-size:14.5px;color:var(--muted)}

/* Recent days list */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li:hover b{color:var(--accent-2)}
.li b{font-weight:600;font-size:15px;color:var(--hi)}
.li small{grid-column:1/-1;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* Calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav button{width:30px;height:30px;border-radius:8px;color:var(--muted);background:var(--panel-2);display:grid;place-items:center}
.cal-nav button:hover{color:var(--hi)}
.cal-m{font-weight:700;font-size:16px;color:var(--hi);min-width:130px;text-align:center}
.cal-sum{color:var(--muted);font-size:14px}
.cal-sum b{color:var(--hi)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1fr);gap:4px}
.wd{font-size:13px;font-weight:600;color:var(--muted);padding:4px 2px}
.day{min-height:80px;border-radius:8px;background:var(--panel-2);padding:7px 9px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px;text-align:left}
.day.out{background:transparent}
.day.future{background:#1d1d1d;color:#4a4a4a}
.day .n{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
a.day:hover{background:#2c2c2c}
.day.win{background:rgba(34,171,148,.18)}
.day.loss{background:rgba(247,82,95,.18)}
.day.win:hover{background:rgba(34,171,148,.26)} .day.loss:hover{background:rgba(247,82,95,.26)}
.day.open{background:#2a2a2a}
.day .st{font-weight:700;font-size:13px;margin-top:auto}
.day.win .st{color:var(--good)} .day.loss .st{color:var(--bad)} .day.open .st{color:var(--muted)}
.day .tc{color:var(--muted);font-size:12px}
.wk{min-height:80px;border-radius:8px;padding:7px 9px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:1px}
.wk b{color:var(--hi);font-size:17px;font-variant-numeric:tabular-nums}

/* Day and trade pages */
.daypage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.banner{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:4px 0 6px}
.banner .big{font-size:30px;font-weight:700;color:var(--hi);letter-spacing:-.02em;line-height:1.15}
.banner.win .big{color:var(--good)} .banner.loss .big{color:var(--bad)}
.banner p{color:var(--muted);font-size:15px;max-width:64ch;margin-top:4px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats span{font-size:13px;color:var(--muted)}
.stats b{font-size:20px;color:var(--hi);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:14.5px}
.kv dt,.kv dd{padding:7px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{font-weight:600;text-align:right;color:var(--hi);font-variant-numeric:tabular-nums}
.checks{list-style:none;display:flex;flex-direction:column}
.checks li{display:flex;font-size:14.5px}
.rule{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:7px 0}
.ck{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid #4a4a4a;color:transparent}
.rule:hover .ck{border-color:var(--muted)}
.ck.y{background:var(--good);color:#fff;border-color:var(--good)}
.ck.n{background:var(--bad);color:#fff;border-color:var(--bad)}
.rule.y span:last-child{color:var(--muted)}
.rule.n span:last-child{color:var(--hi)}
.rules-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.trades{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:56px 60px minmax(0,1fr) 64px auto 14px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tr:last-child{border-bottom:0}
.tr:hover span:nth-child(3){color:var(--accent-2)}
.tr .r{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tr .go{color:var(--muted)}
.none{color:var(--muted);font-size:14px}
.addtr{display:grid;grid-template-columns:84px 96px minmax(0,1fr) 76px auto;gap:8px;align-items:center;padding-top:6px}
.in{height:36px;border-radius:8px;border:1px solid transparent;background:var(--panel-2);padding:0 11px;font-size:14px;width:100%;min-width:0;color:var(--hi)}
.in:hover{border-color:var(--line-2)}
.in:focus{outline:none;border-color:var(--accent)}
.in::placeholder{color:#6b6b6b}
textarea.in{height:auto;min-height:80px;padding:10px 11px;resize:vertical;line-height:1.5}
.emo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.emo label{padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--panel-2);border-radius:8px}
.emo span{font-size:12.5px;color:var(--muted)}
.emo input{background:none;border:0;font-weight:600;font-size:15px;padding:0;width:100%;color:var(--hi)}
.emo input:focus{outline:none}
.pager{display:flex;gap:8px}
.pager a,.pager span{font-size:14px;padding:6px 12px;border-radius:8px;background:var(--panel);color:var(--muted)}
.pager a:hover{color:var(--hi)}
.pager span{opacity:.35}
.pre{display:flex;flex-direction:column;gap:12px}
.light{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.light::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.light.go{color:var(--good)} .light.wait{color:var(--warn)} .light.stop{color:var(--bad)}
.light small{font-weight:500;color:var(--muted);margin-left:auto;font-size:13px;text-align:right}
.scn{display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.scn b{font-size:13px;color:var(--muted);font-weight:600}
.scn p span{color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{width:96px;height:60px;border-radius:6px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* Notes editor */
.notes .tabs{display:flex;gap:4px;width:max-content;background:var(--panel-2);border-radius:8px;padding:3px}
.notes .tabs a,.notes .tabs span{padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:6px}
.notes .tabs a:hover{color:var(--hi)}
.notes .tabs span.on{background:#3a3a3a;color:var(--hi)}
.tpl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tpl > span{font-size:13.5px;color:var(--muted);margin-right:4px}
.chip{height:30px;padding:0 13px;border-radius:15px;background:var(--panel-2);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px;color:var(--text);transition:background .1s}
.chip:hover{background:#2e2e2e;color:var(--hi)}
.chip.add{color:var(--accent-2)}
.tb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.tb .sep{width:1px;height:18px;background:var(--line-2);margin:0 6px}
.tb button,.tb select{height:30px;min-width:30px;padding:0 7px;border-radius:6px;color:var(--muted);display:inline-grid;place-items:center;font-size:14px;background:none}
.tb select{background:var(--panel-2);color:var(--hi);padding:0 6px}
.tb button:hover{background:var(--panel-2);color:var(--hi)}
.tb svg{width:16px;height:16px}
.tb .right{margin-left:auto;display:flex;gap:2px;align-items:center}
.saved{font-size:13px;color:var(--muted)}
.ed{min-height:240px;padding:10px 0 2px;outline:none;font-size:15.5px;line-height:1.65;color:var(--hi)}
.ed:empty::before{content:attr(data-ph);color:#6b6b6b}
.ed h1{font-size:24px;margin:12px 0 4px} .ed h2{font-size:19px;margin:12px 0 4px} .ed h3{font-size:15.5px;margin:10px 0 2px;color:var(--text)}
.ed p,.ed div{margin:2px 0}
.ed ul,.ed ol{padding-left:22px;margin:4px 0}
.ed ul.todo{list-style:none;padding-left:2px}
.ed ul.todo li{position:relative;padding-left:28px;margin:5px 0;cursor:text}
.ed ul.todo li::before{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:5px;border:1.5px solid #5a5a5a;cursor:pointer}
.ed ul.todo li.done{color:var(--muted);text-decoration:line-through}
.ed ul.todo li.done::before{background:var(--accent);border-color:var(--accent)}
.ed ul.todo li.done::after{content:"";position:absolute;left:6px;top:7px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ed blockquote{border-left:3px solid var(--line-2);padding:2px 14px;margin:6px 0;color:var(--text)}
.ed hr{border:0;border-top:1px solid var(--line-2);margin:16px 0}
.ed a{color:var(--accent-2);text-decoration:underline}
.ed .callout{background:var(--panel-2);border-radius:8px;padding:10px 14px;margin:6px 0}
.pop{position:absolute;z-index:30;background:var(--panel-2);border-radius:10px;padding:5px;display:flex;flex-direction:column;min-width:180px;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.pop button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;text-align:left;font-size:14px}
.pop button:hover{background:#333}
.pop .row{display:flex;gap:6px;padding:4px}
.pop .row button{width:22px;height:22px;padding:0;border-radius:50%}

/* Notebook */
.nb{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
.nb-l{display:flex;flex-direction:column;gap:12px;position:sticky;top:0;max-height:calc(100vh - 60px - 44px);overflow:hidden}
.nb-f{display:flex;gap:6px;flex-wrap:wrap}
.nb-f button{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:15px;background:var(--panel);color:var(--muted);font-weight:600;font-size:13px}
.nb-f button:hover{color:var(--hi)}
.nb-f button[aria-pressed="true"]{background:var(--hi);color:#000}
.nb-f button[aria-pressed="true"] small{color:#555}
.nb-f small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nb-list{overflow-y:auto;display:flex;flex-direction:column}
.nb-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 12px;align-items:center;border-radius:10px}
.nb-i:hover{background:var(--panel)}
.nb-i.on{background:var(--panel)}
.nb-i.new{background:var(--accent-soft)}
.nb-i b{font-size:15px;font-weight:700;color:var(--hi);font-variant-numeric:tabular-nums}
.nb-i small{grid-column:1/-1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nb-i small.sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#a8a8a8}
.nb-r{min-width:0}
.nb-r .empty{min-height:420px}
@media (max-width:1650px){.nb .daypage{grid-template-columns:1fr}.nb .daypage > .col:last-child{order:-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}}
@media (max-width:900px){.nb{grid-template-columns:1fr}.nb-l{position:static;max-height:380px}}

/* Start my day page */
.wz{display:flex;flex-direction:column;gap:16px;max-width:980px}
.wz-b{gap:16px;padding:22px 24px}
.wz-f{position:sticky;bottom:-40px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 22px;background:linear-gradient(transparent,var(--canvas) 35%)}
.steps{display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.steps span{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--muted);padding:0 0 12px;margin-bottom:-1px;border-bottom:2px solid transparent}
.steps span i{font-style:normal;font-variant-numeric:tabular-nums}
.steps span.on{color:var(--hi);border-bottom-color:var(--hi)}
.steps span.ok{color:var(--good)}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.q > div{color:var(--hi);font-size:15.5px}
.q small{display:block;color:var(--muted);font-size:13px}
.seg{display:inline-flex;gap:3px;background:var(--panel-2);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{padding:5px 12px;font-size:14px;border-radius:6px;min-width:34px;color:var(--muted);font-weight:600}
.seg button:hover{color:var(--hi)}
.seg button[aria-pressed="true"]{background:var(--hi);color:#000}
.seg.big button{padding:8px 20px;font-size:15px}
.fl{font-size:13px;font-weight:600;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.wgrid .card{background:var(--panel-2)!important;padding:16px}
.wgrid .card .in{background:#2c2c2c}
.shotbox{border:1.5px dashed #3c3c3c;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font-size:13.5px;color:var(--muted);text-align:center}
.shotbox:hover{border-color:#555}
.shotbox.on{border-color:var(--accent);border-style:solid;color:var(--hi)}
.shotbox .thumbs{justify-content:center}
.shotbox label{text-decoration:underline;cursor:pointer}
.ws{list-style:none;display:flex;flex-direction:column}
.ws li{padding:12px 0;border-bottom:1px solid var(--line)}
.ws li:last-child{border-bottom:0}
.ws b{font-size:15px;color:var(--hi)}
.ws li.hot b{color:var(--bad)}
.ws p{font-size:14px;color:var(--muted);margin-top:2px}
.ws .why{font-size:12.5px;font-weight:600;color:var(--bad);margin-left:8px}
.ack{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer;color:var(--hi)}
.ack input{width:18px;height:18px;accent-color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sum div{padding:12px 14px;background:var(--panel-2);border-radius:8px;color:var(--hi)}
.sum span{display:block;font-size:12.5px;color:var(--muted)}

/* Notebook folders */

.nb-pick{position:relative;flex:none}
.nb-cur{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px 0 16px;border-radius:999px;background:var(--panel);color:#fff;font-weight:700;font-size:15px;text-align:left}
.nb-cur{background:#fff;color:#000}
.nb-cur:hover{background:#e9e9e9}
.nb-cur small{color:#6b6b6b!important}
.nb-cur span svg{color:#555!important}
.nb-cur .chev2{background:#e3e3e3!important;color:#000!important}
.nb-cur span{flex:1;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nb-cur span svg{width:16px;height:16px;color:var(--muted);flex:none}
.nb-cur small{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.nb-cur .chev2{width:28px;height:28px;padding:6px;border-radius:50%;background:var(--panel-2);color:var(--text);flex:none;transition:transform .15s}
.nb-pick.open .chev2{transform:rotate(180deg)}
.nb-pick .nb-menu{display:none}
.nb .nb-l{overflow:visible}
.nb .nb-list{overflow-y:auto;flex:1;min-height:0}
.nb-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#1c1c1c;border-radius:16px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.6);max-height:min(520px,calc(100vh - 180px));overflow-y:auto}
.nb-pick.open .nb-menu{display:flex}
.nb-pick + .nb-list{border-top:0;padding-top:4px}
.nb-l{gap:14px}
.nb-nav{display:flex;flex-direction:column;gap:1px;flex:none}
.nb-nav button[data-nbf]{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;text-align:left}
.nb-nav button[data-nbf] span{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-nav button[data-nbf] svg{width:15px;height:15px;flex:none}
.nb-nav button[data-nbf]:hover{color:#fff}
.nb-nav button[data-nbf][aria-pressed="true"]{background:var(--panel-2);color:#fff}
.nb-nav small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nb-nav .drop{background:var(--accent-soft)!important;color:#fff!important;box-shadow:inset 0 0 0 1.5px var(--accent)}
.nb-sec{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em;padding:14px 12px 4px}
.nb-sec .ib{width:24px;height:24px}
.nb-hint{font-size:13px;color:var(--muted);padding:6px 12px;line-height:1.5}
.nb-list{border-top:1px solid var(--line);padding-top:10px;min-height:0}
.nb-head{display:flex;align-items:center;gap:6px;padding:0 4px 8px}
.nb-head .fname{flex:1;height:34px;font-weight:700;background:transparent;font-size:15px;padding:0 8px}
.nb-head .fname:hover{background:var(--panel-2)}
.nb-t{flex:1;font-weight:700;color:#fff;padding-left:8px}
.nb-w{position:relative}
.nb-w .rm{position:absolute;right:6px;top:6px;width:26px;height:26px;opacity:0}
.nb-w:hover .rm,.nb-w .rm:focus-visible{opacity:1}
.nb-w:hover .nb-i > .pill{visibility:hidden}
.nb-i[draggable="true"]{cursor:pointer}
.nb-i.dragging{opacity:.4}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;font-weight:600;color:#fff}
.fchip svg{width:14px;height:14px;color:var(--muted)}
.fchip button{width:20px;height:20px;border-radius:50%;color:var(--muted);font-size:15px;line-height:1}
.fchip button:hover{background:#333;color:#fff}
.fsel{height:30px;border-radius:999px;background:var(--panel);border:0;color:var(--muted);font-weight:600;font-size:13px;padding:0 12px;cursor:pointer}
.fsel:hover{color:#fff}
.notehead{display:flex;gap:12px;align-items:center}
.ntitle{flex:1;background:none;border:0;font-size:30px;font-weight:700;color:#fff;letter-spacing:-.02em;padding:2px 0;min-width:0}
.ntitle:focus{outline:none}
.ntitle::placeholder{color:#4a4a4a}
@media (hover:none){.nb-w .rm{opacity:1}.nb-w .nb-i > .pill{visibility:hidden}}


/* Sidebar and list toggles, like Claude */
.tmark{display:inline-flex;margin-left:6px}
.mark.sm{width:28px;height:28px}
.tmark:hover .mark{filter:brightness(1.3)}
.pt-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--muted);flex:none}
.pt-btn:hover{color:#fff;background:var(--panel)}
.app{transition:grid-template-columns .18s ease}
.app.noside{grid-template-columns:0 minmax(0,1fr)}
.app.noside .side{visibility:hidden;padding:0;overflow:hidden;border:0}
.nb-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nb-tools .fbar{margin-bottom:0}
.nb.nolist{grid-template-columns:minmax(0,1fr)}
@media (min-width:1101px){.nb.nolist .daypage{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.nb.nolist .daypage > .col:last-child{order:0;display:flex}}
@media (max-width:760px){.app.noside{grid-template-columns:1fr}.app.noside .side{visibility:visible;padding:20px 14px}}


.sp-pick{position:relative;display:inline-block;margin-top:12px}
.sp-cur{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 14px;border-radius:999px;background:var(--panel);color:#fff;font-weight:600;font-size:13.5px}
.sp-cur:hover{background:var(--panel-2)}
.sp-l{color:var(--muted);font-weight:500}
.sp-cur .chev2{width:26px;height:26px;padding:6px;border-radius:50%;background:var(--panel-2);color:var(--text);transition:transform .15s}
.sp-pick.open .chev2{transform:rotate(180deg)}
.sp-menu{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:25;width:260px;background:#1c1c1c;border-radius:16px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.6);flex-direction:column;gap:2px}
.sp-pick.open .sp-menu{display:flex}
.sp-o{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 12px;border-radius:10px}
.sp-o b{font-size:14px;color:var(--text)}
.sp-o small{font-size:12px;color:var(--muted)}
.sp-o:hover:not(:disabled){background:var(--panel-2)}
.sp-o.on{background:var(--panel-2)}
.sp-o.on b{color:#fff}
.sp-o:disabled{opacity:.35;cursor:default}
.sp-o.danger{background:var(--bad-soft)}
.sp-o.danger b{color:var(--bad)}
/* Metrics, Performance, Accounts */
.day.nt{background:#3a3a3a;color:var(--text)} .day.nt:hover{background:#444} .day.nt .st{color:#c9c9c9}
.pill.nt{color:#b8b8b8}
.pg.nt{background:#5a5a5a}
.banner.nt .big{color:#c9c9c9}
.pg-top{display:flex;gap:28px}
.pg-top div{display:flex;flex-direction:column}
.pg-top b{font-size:26px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1.15}
.pg-top b.pos{color:var(--good)} .pg-top b.neg{color:var(--bad)}
.pg-top span{font-size:12.5px;color:var(--muted)}
.pg-grid{display:grid;grid-template-columns:30px repeat(6,minmax(0,1fr));gap:5px;align-items:center}
.pg-w{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.pg-d{font-size:11.5px;color:var(--muted)}
.pg{display:block;aspect-ratio:1.6;border-radius:6px;background:#262626}
a.pg:hover{outline:2px solid #fff;outline-offset:1px}
.pg.w{background:var(--good)} .pg.l{background:var(--bad)} .pg.open{background:#4a4a4a}
.pg.fut{background:transparent;box-shadow:inset 0 0 0 1px #262626}
.pg.td{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px #fff}
.pg-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pg-leg span{display:inline-flex;align-items:center;gap:6px}
.pg-leg .pg{width:12px;aspect-ratio:1;border-radius:3px}

.perf .bx-h h2::after{content:none}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi-t{font-size:17px;font-weight:700;color:#fff;line-height:1.3;margin:4px 0 2px}
.kpi-v.pos{color:var(--good)} .kpi-v.neg{color:var(--bad)}
.meter{height:4px;background:#2c2c2c;border-radius:2px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:2px}
.meter.big{height:8px;border-radius:4px;margin-top:16px}
.vbars{display:flex;gap:3px;align-items:flex-end;height:120px}
.vb{flex:1;max-width:22px;border-radius:3px;height:100%;background:var(--good)}
.vb.l{background:var(--bad);height:55%}
.vb:hover{opacity:.75}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hb span{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb b{color:var(--bad)}
.hb i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bad);display:block;min-width:6px}
.cost{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cost.big{grid-template-columns:repeat(3,minmax(0,1fr))}
.cost div{background:var(--panel-2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.cost span{font-size:13px;color:var(--muted)}
.cost b{font-size:26px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.cost b.pos{color:var(--good)} .cost b.neg{color:var(--bad)}
.cost small{font-size:12.5px;color:var(--muted)}
.perf{display:flex;flex-direction:column;gap:16px}
.ph-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pt{font-size:28px;font-weight:700;color:#fff;letter-spacing:-.02em}
.rlb{display:flex;flex-direction:column;gap:14px}
.rb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px;gap:16px;align-items:center}
.rb-l b{display:block;color:#fff;font-size:15px}
.rb-l small{font-size:13px;color:var(--muted)}
.bar{height:8px;background:#2a2a2a;border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--bad);border-radius:4px}
.rb > b{text-align:right;font-size:15px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 36px}
.h3{font-size:15px;font-weight:700;color:#fff;margin-bottom:10px}
.rates{display:flex;flex-direction:column;gap:8px}
.rt{display:grid;grid-template-columns:130px minmax(0,1fr) 44px 40px;gap:10px;align-items:center;font-size:14px}
.rt > span:first-child{color:var(--text)}
.rt b{color:#fff;text-align:right}
.rt small{color:var(--muted);font-size:12px;text-align:right}
.rt.na{opacity:.4}
.feel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feel > div > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.feel p{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.feel p b{color:#fff;text-transform:capitalize}
.feel p small{color:var(--muted)}
.fixes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.fx{background:var(--panel-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fx-h{display:flex;justify-content:space-between;gap:10px}
.fx-h b{color:#fff;font-size:15px}
.fx-c span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.fx-c p{font-size:14px;line-height:1.55;color:var(--text);margin-bottom:4px}
.fx .in{background:#2a2a2a}
.lock{border:1.5px solid rgba(247,82,95,.35)}
.lock.open{border-color:rgba(34,171,148,.4)}
.lock-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.lock-h b{display:block;font-size:28px;font-weight:700;color:var(--bad);margin:2px 0}
.lock.open .lock-h b{color:var(--good)}
.lock-h p{color:var(--text);font-size:14.5px;max-width:60ch}
.lock .meter i{background:var(--bad)}
.lock.open .meter i{background:var(--good)}
.af{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.af.sm2{width:110px}
.acc-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.acc-h > div{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acc-h b{font-size:19px;color:#fff}
.acc-k{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.acc-k div{background:var(--panel-2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.acc-k span{font-size:13px;color:var(--muted)}
.acc-k b{font-size:24px;color:#fff;font-variant-numeric:tabular-nums}
.acc-k b.pos{color:var(--good)} .acc-k b.neg{color:var(--bad)}
.acc-k small{font-size:12.5px;color:var(--muted)}
.acc-f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.acc.dead{opacity:.6}
@media (max-width:1100px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.acc-f{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.cost.big{grid-template-columns:1fr}.rb{grid-template-columns:1fr 48px}.rb .bar{grid-column:1/-1;order:3}.rt{grid-template-columns:110px minmax(0,1fr) 40px 36px}}
@media (max-width:560px){.acc-f,.acc-k,.cost{grid-template-columns:1fr}}

/* Settings */
.avwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.avpick{position:relative;cursor:pointer;border-radius:50%}
.avpick:hover .av{filter:brightness(.7)}
.avcam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 0 0 3px var(--panel)}
.avcam svg{width:14px;height:14px}
img.av{object-fit:cover;padding:0}
.sm3{font-size:12.5px}
.prof-top{align-items:center}
.set .bx-h h2::after{content:none}

.set-nav a{padding:9px 14px;border-radius:999px;color:var(--muted);font-weight:600}
.set-nav a:hover{color:#fff}
.set-nav a[aria-current="page"]{background:var(--panel-2);color:#fff}
.set-body{display:flex;flex-direction:column;gap:16px;min-width:0}
.expl{font-size:14.5px;color:var(--muted);max-width:70ch;margin:-6px 0 18px;line-height:1.6}
.expl b{color:var(--hi)}
.hint2{font-size:12.5px;color:var(--muted)}
.prof-top{display:flex;gap:18px;align-items:flex-end;margin-bottom:20px}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.av.big{width:64px;height:64px;font-size:22px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px;margin-bottom:16px}
.rlist{list-style:none;display:flex;flex-direction:column;gap:6px}
.rlist li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:8px 10px}
.rlist li.off .rl{color:var(--muted);text-decoration:line-through}
.rlist .rl{flex:1;background:transparent;height:34px}
.rlist .rl:hover{background:#2a2a2a}
.rlist .rl:focus{background:var(--canvas)}
.rlist .tname{flex:none;font-weight:700;color:var(--hi);min-width:150px}
.rlist .since{flex:1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlist li .since:empty{display:none}
.ord{display:flex;flex-direction:column}
.ord .ib{height:16px;width:24px}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;color:var(--muted);flex:none}

/* ---- Refinement: TradingView site language. Pill controls, 16px cards, no hairlines inside cards, symbol chips ---- */

/* v5: trade editor, kill switch, end my day, playbook, search */
.tedit{display:grid;grid-template-columns:110px 120px minmax(0,1fr) 110px;gap:10px}
.tedit-f{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.emorow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.emorow:first-child{border-top:0;padding-top:0}
.emorow > span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.on{background:#fff;color:#000}
.chip.bad.on{background:var(--bad);color:#fff}
.tag-auto{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel-2);border-radius:999px;padding:2px 8px;margin-left:auto;white-space:nowrap}
.tag-auto.tr{color:var(--bad)}
.kill{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:rgba(247,82,95,.12);color:#fff;font-size:14.5px}
.kill.soft{background:rgba(41,98,255,.14)}
.kill b{font-weight:700}
.kill span{color:var(--muted)}
.kill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.kill.soft::before{background:var(--accent)}
.remind{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-radius:12px;background:var(--panel);font-size:14.5px;color:var(--muted)}
.remind b{color:var(--hi)}
.sb-btns{display:flex;gap:8px;flex-wrap:wrap}
.reclink{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel-2);margin-top:10px;color:var(--hi);font-weight:600}
.reclink small{color:var(--muted);font-weight:500;display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.reclink .play{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}
.endp{max-width:820px;display:flex;flex-direction:column;gap:16px}
.endp .bx-h h2::after{content:none}
.box > .emorow:first-of-type{border-top:0;padding-top:0}
.endp .box h2 .n{color:var(--muted);font-weight:600;margin-right:8px}
.postkv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:14.5px}
.postkv dt{color:var(--muted)}
.nb-q{margin:0 0 8px;height:34px;font-size:14px;width:100%}
.nb-i.qhide,.nb-w.qhide{display:none}
.pbl{display:flex;flex-direction:column;gap:12px}
.pb{background:var(--panel-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pb-h{display:flex;gap:10px;align-items:center}
.pb-h .in{font-weight:700;font-size:16px;background:#2a2a2a}
.pb-c{display:flex;gap:8px;align-items:center}
.pb-c .in{background:#2a2a2a;height:34px;font-size:14px}
.pb .ck{flex:none}
.chk-l{list-style:none;display:flex;flex-direction:column}
.setstat{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pbn{width:22px;text-align:center;color:var(--muted);font-size:13px;flex:none}
.chip .x{margin-left:2px;opacity:.6}
.prng{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pwk{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--hi)}
.pwk .ib:disabled{opacity:.3}
.rl2l{list-style:none;display:flex;flex-direction:column}
.rl2{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px}
.rl-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.rl-t small{font-size:12.5px}
.yn{display:flex;gap:4px;flex:none}
.yn button{width:34px;height:28px;border-radius:999px;background:var(--panel-2);color:var(--muted);font-weight:700;font-size:13px}
.yn button:hover{color:var(--hi)}
.yn button[data-v="y"][aria-pressed="true"]{background:var(--good);color:#fff}
.yn button[data-v="n"][aria-pressed="true"]{background:var(--bad);color:#fff}
.sbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 16px;border-radius:12px;background:var(--panel);font-size:14px;color:var(--muted)}
.sbar b{color:var(--hi)}
.sbar .light{font-size:14px}
.pause{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:rgba(240,180,41,.12);font-size:14.5px;flex-wrap:wrap}
.pause b{color:#fff}
.pause .cd{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--warn)}
.pause .pz-t{color:var(--muted)}
.pause.over{background:var(--panel)}
.startbar .sb-btns{flex-direction:row;align-items:center}
.rl2 > .tag-auto{flex:0 0 auto;width:auto!important;margin-left:0;display:inline-block!important;grid-column:auto}
.rl2 > .rl-t{flex:1 1 auto;display:flex;flex-direction:column}
.rl2 .yn{flex:0 0 auto}
.sgrp{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 0 2px}
.sgrp:first-child{padding-top:0}
.yn button.mr[aria-pressed="true"]{background:var(--warn);color:#000}
.pb-t{font-size:16px;color:#fff;flex:1;padding:6px 0}
.syncst{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvw{border-radius:var(--r);overflow:hidden}
.tvw[data-tv="tape"]{margin-bottom:14px}
.ytw{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin-top:10px;background:#000}
.ytw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.focus{font-size:15.5px;color:var(--hi);font-weight:600}
.stbl{width:100%;border-collapse:collapse;font-size:14px}
.stbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.stbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.stbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.chip.dang{background:var(--bad);color:#fff}
@media (max-width:760px){.tedit{grid-template-columns:1fr 1fr}.postkv{grid-template-columns:1fr}}
body:not(.unlocked) .app{display:none}
.lockv{position:fixed;inset:0;display:grid;place-items:center;background:#0a0a0a;padding:16px}
.lockv form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lockv .lm{width:56px;height:56px;margin:0 auto 6px}
.lockv h1{font-size:24px;color:#fff;font-weight:700;letter-spacing:-.02em}
.lockv p{color:#8f939e;font-size:14.5px}
.lockv input{height:46px;border-radius:999px;background:#161616;border:1px solid #2a2a2a;color:#fff;padding:0 18px;font-size:16px;text-align:center}
.lockv input:focus{outline:none;border-color:#2962ff}
.lockv button{height:46px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:15px}
.lockv button:disabled{opacity:.6}
.lockv .msg{min-height:20px;font-size:13.5px;color:#f7525f}

let CL=null,clBase=null,clState='local',clBusy=false,clAgain=false,clT=null,clLast={},ASSETS=null;
function coreObj(){const o={};Object.keys(ST).forEach(k=>{if(k!=='days'&&k!=='notes')o[k]=ST[k]});return o}
function snapDocs(){const out={core:JSON.stringify(coreObj())};Object.keys(ST.days).forEach(k=>{if(hasContent(k))out['d:'+k]=JSON.stringify(ST.days[k])});Object.keys(ST.notes).forEach(k=>out['n:'+k]=JSON.stringify(ST.notes[k]));return out}
const clRef=id=>id==='core'?clBase:clBase.collection(id[0]==='d'?'days':'notes').doc(id.slice(2));
function setSync(st){clState=st;const el=document.getElementById('syncst');if(el)el.textContent=syncLabel()}
const syncLabel=()=>({local:'Saved in this browser',syncing:'Syncing…',saving:'Saving…',synced:'Synced',offline:'Not saved yet · retrying',toobig:'An entry is too large to sync'})[clState]||'';
function clSchedule(){if(!CL)return;clearTimeout(clT);clT=setTimeout(clPush,1200)}
async function clPush(){if(!CL)return;if(clBusy){clAgain=true;return}clBusy=true;setSync('saving');let big=false;const seq=dirtySeq;
  try{const now=snapDocs();
    for(const id of Object.keys(now)){if(now[id]===clLast[id])continue;
      const live=id==='core'?ST:id[0]==='d'?ST.days[id.slice(2)]:ST.notes[id.slice(2)];if(!live)continue;live._u=Date.now();
      const js=JSON.stringify(id==='core'?coreObj():live);if(js.length>250000){big=true;continue}
      await clRef(id).set(JSON.parse(js));clLast[id]=js}
    for(const id of Object.keys(clLast)){if(id in now)continue;await clRef(id).delete();delete clLast[id];(ST.gone=ST.gone||{})[id]=Date.now();clAgain=true}
    if(ST.gone){const cut=Date.now()-60*864e5;Object.keys(ST.gone).forEach(x=>{if(ST.gone[x]<cut)delete ST.gone[x]})}
    syncedSeq=Math.max(syncedSeq,seq);setSync(big?'toobig':'synced')}
  catch(e){setSync('offline');clearTimeout(clT);clT=setTimeout(clPush,15000)}
  finally{try{saveLocal(JSON.stringify(ST))}catch(_){}clBusy=false;if(clAgain){clAgain=false;clSchedule()}}}
async function clInit(){try{if(!window.claude?.use)return;const db=await claude.use('db');if(!db)return;const us=await claude.use('user');const uid=us?await us.id():null;if(!uid)return;
  setSync('syncing');const base=db.doc(`data/users/${uid}/core`);
  const [cs,ds,ns]=await Promise.all([base.get(),base.collection('days').get(),base.collection('notes').get()]);
  CL=db;clBase=base;const before=JSON.stringify(ST);
  if(cs.exists){const C={core:clone(cs.data()),days:{},notes:{}};ds.docs.forEach(d=>C.days[d.id]=clone(d.data()));ns.docs.forEach(d=>C.notes[d.id]=clone(d.data()));
    clLast={core:JSON.stringify(cs.data())};ds.docs.forEach(d=>clLast['d:'+d.id]=JSON.stringify(d.data()));ns.docs.forEach(d=>clLast['n:'+d.id]=JSON.stringify(d.data()));
    if(!ST._synced){/* this browser never synced: the account wins */Object.keys(ST).forEach(k=>delete ST[k]);Object.assign(ST,C.core,{days:C.days,notes:C.notes})}
    else{const gone={...(C.core.gone||{}),...(ST.gone||{})};const newer=(a,b)=>(a?._u||0)>=(b?._u||0)?a:b;
      const core=newer(C.core,coreObj()),days={},notes={};
      new Set([...Object.keys(C.days),...Object.keys(ST.days)]).forEach(k=>{const v=newer(C.days[k],ST.days[k]);if(v&&!((gone['d:'+k]||0)>(v._u||0)))days[k]=v});
      new Set([...Object.keys(C.notes),...Object.keys(ST.notes)]).forEach(k=>{const v=newer(C.notes[k],ST.notes[k]);if(v&&!((gone['n:'+k]||0)>(v._u||0)))notes[k]=v});
      Object.keys(ST).forEach(k=>delete ST[k]);Object.assign(ST,clone(core),{days,notes,gone})}}
  ST._synced=1;
  try{ASSETS=await claude.use('assets')}catch(_){}
  if(ASSETS)await moveShots();
  if(JSON.stringify(ST)!==before){try{saveLocal(JSON.stringify(ST))}catch(_){}rerenderKeepScroll()}
  if(!cs.exists)toast('Your journal is now saved in '+ACCT);
  await clPush()}catch(e){if(CL)setSync('offline');else setSync('local')}}

function calendar(){

  const lead=(first.getUTCDay()+6)%7,cells=[];
  for(let i=0;i<lead;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(`${calMonth}-${String(d).padStart(2,'0')}`);
  while(cells.length%7)cells.push(null);
  let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('')+'<div class="wd wkh">Week</div>';
  for(let w=0;w<cells.length;w+=7){
    const week=cells.slice(w,w+7);
    html+=week.map(k=>{
      if(!k)return '<div class="day out"></div>';
      const d=+k.slice(8),td=k===todayKey?' today':'';
      if(k>todayKey)return `<div class="day future"><span class="n">${d}</span></div>`;
      const s=hasContent(k)?statusOf(k):null;

    }).join('');
    const j=week.filter(k=>k&&['win','loss'].includes(statusOf(k))),wins=j.filter(isWin).length;
    html+=`<div class="wk"><span>Week ${w/7+1}</span>${j.length?`<b>${wins}/${j.length}</b><span>win days</span>`:'<span>–</span>'}</div>`;

}

  if(ed.dataset.ed.startsWith('tpl:'))return;ed.innerHTML=refGet(ed.dataset.ed);
  ed.addEventListener('input',()=>{setSaved('Saving…');refSet(ed.dataset.ed,ed.innerHTML.replace(/^<br>$/,''))})})}
let lastEd=null,savedRange=null;
document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount)return;const n=s.anchorNode&&(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);const ed=n&&n.closest&&n.closest('[data-ed]');if(ed){lastEd=ed;savedRange=s.getRangeAt(0).cloneRange()}});
function restore(){if(!lastEd||!document.body.contains(lastEd))return false;lastEd.focus();if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}return true}
function exec(cmd,val){if(!restore())return;document.execCommand('styleWithCSS',false,cmd==='hiliteColor'||cmd==='foreColor');document.execCommand(cmd,false,val??null);lastEd.dispatchEvent(new Event('input'))}
function insertHTML(h){if(!restore())return;document.execCommand('insertHTML',false,h);lastEd.dispatchEvent(new Event('input'))}

  const cols=['#eceef3','#8a90a0','#8b7cf6','#3ecf8e','#e6b450','#f0616d','#5aa9f0'];

  else p.innerHTML='<button type="button" data-ins="hr">Divider</button><button type="button" data-ins="callout">Callout box</button><button type="button" data-ins="todo">Checklist</button><button type="button" data-ins="link">Link from selection</button>';

/* ---- Start my day wizard ---- */
let WZ=null;
const STEPS=['Psych check & risk','Daily bias & scenarios','Weak spots','Summary'];
function lastResult(k){const p=keys().filter(x=>x<k).at(-1);if(!p)return null;const s=statusOf(p);if(s==='loss')return'Rule break';if(s==='nt'||!(ST.days[p].trades||[]).length)return'No trade';const r=dayR(p);return r>0?'Win':r<0?'Loss':null}
function initWizard(k){const d=day(k);WZ={k,step:0,p:d.plan?clone(d.plan):blankPlan(),shot:null};if(!WZ.p.risk)WZ.p.risk=ST.settings.profile.risk||'';if(!d.plan&&WZ.p.S.last==null)WZ.p.S.last=lastResult(k)}
function wget(path){return path.split('.').reduce((o,x)=>o?.[x],WZ.p)}
function wset(path,v){const ps=path.split('.');let o=WZ.p;ps.slice(0,-1).forEach(x=>o=o[x]);o[ps.at(-1)]=v}
function shotBox(key,lab){const a=WZ.p.shots[key]||[];return `<div class="shotbox${WZ.shot===key?' on':''}" data-shotbox="${key}" tabindex="0" role="button" aria-label="Add ${lab} screenshot"><span><b>${lab}</b>${a.length?` · ${a.length}`:''}</span>${a.length?`<div class="thumbs">${a.map((u,i)=>`<button type="button" data-zoom="wz:${key}" data-i="${i}"><img src="${imgSrc(u)}" data-img="${esc(u)}" alt=""></button>`).join('')}</div>`:''}<span>Click, then ⌘V · drop images · <label>choose files<input type="file" accept="image/*" multiple data-shotfile="${key}" hidden></label></span></div>`}
function wizBody(){
  const p=WZ.p,[c,v,t]=light(p.S);
  if(WZ.step===0)return `<div>${Q.map(([id,l,s,opts])=>`<div class="q"><div>${l}<small>${s}</small></div>${seg(`data-wq="${id}"`,opts.map(String),p.S[id]==null?null:String(p.S[id]))}</div>`).join('')}</div>
    <div class="fld"><label class="fl" for="wrisk">Risk per trade (1R)</label><input class="in" id="wrisk" data-wf="risk" value="${esc(p.risk)}" placeholder="e.g. $400" style="max-width:220px"></div>
    ${c?`<div class="light ${c}">${v}<small>${t}</small></div>`:''}`;
  if(WZ.step===1){const sc=x=>`<div class="card" style="background:var(--panel-2)"><header class="card-h"><h2>Scenario ${x}</h2></header>${shotBox(x,'15m charts')}
      <div class="fld"><label class="fl" for="w${x}it">If, then</label><textarea class="in" id="w${x}it" data-wf="${x}.it" placeholder="e.g. If price sweeps the Asia low and displaces up, then I look for longs toward PDH.">${esc(p[x].it)}</textarea></div>
      <div class="fld"><label class="fl" for="w${x}tgt">Target</label><input class="in" id="w${x}tgt" data-wf="${x}.tgt" value="${esc(p[x].tgt)}" placeholder="e.g. PDH, partials at the NY midnight open"></div>
      <div class="fld"><label class="fl" for="w${x}inv">Invalidation</label><input class="in" id="w${x}inv" data-wf="${x}.inv" value="${esc(p[x].inv)}" placeholder="e.g. 15m close back below the Asia low"></div></div>`;
    return `<div class="fld"><span class="fl">Daily bias</span>${seg('data-wbias',['Bullish','Bearish','Neutral'],p.bias,true)}</div>${shotBox('bias','Higher timeframe charts')}

      <div class="wgrid">${sc('A')}${sc('B')}</div>`}
  if(WZ.step===2){const ws=WSL().map(w=>({...w,h:w.hot(p.S)})).sort((a,b)=>b.h-a.h);
    return `<div class="fld"><label class="fl" for="wwrong">Last session: what went wrong?</label><textarea class="in" id="wwrong" data-wf="wrong" placeholder="e.g. Entered before the 15m close because I was afraid to miss the move.">${esc(p.wrong)}</textarea></div>
      <div class="fld"><label class="fl" for="wlesson">What will you do differently?</label><textarea class="in" id="wlesson" data-wf="lesson" placeholder="e.g. I wait for the candle to close, every time.">${esc(p.lesson)}</textarea></div>
      <div class="fld"><label class="fl" for="wwatch">What do you watch out for today?</label><textarea class="in" id="wwatch" data-wf="watch" placeholder="e.g. No chasing the London high. One trade, then the laptop closes.">${esc(p.watch)}</textarea></div>
      ${(()=>{const f=ST.weeks[prevWk(isoWeek(WZ.k))]?.focus;return f?`<div class="scn"><b>Focus this week</b><p>${esc(f)}</p></div>`:''})()}
      <span class="fl">Your four weak spots</span><ul class="ws">${ws.map(w=>`<li class="${w.h?'hot':''}"><b>${w.t}</b>${w.h?`<span class="why">${w.why}</span>`:''}<p>${w.r}</p></li>`).join('')}</ul>
      <label class="ack"><input type="checkbox" data-wack ${p.ack?'checked':''}> I read my weak spots and I trade only my plan today.</label>`}
  return `${c?`<div class="light ${c}">${v}<small>${t}</small></div>`:''}<div class="sum">
    <div><span>Risk per trade</span><b>${esc(p.risk||'–')}</b></div><div><span>Daily bias</span><b>${esc(p.bias||'–')}</b></div>
    <div><span>Scenario A</span>${esc(p.A.it||'–')}</div><div><span>Scenario B</span>${esc(p.B.it||'–')}</div>
    <div style="grid-column:1/-1"><span>Watch today</span>${esc(p.watch||'–')}</div></div>`;
}
function stepOk(){const p=WZ.p,c=light(p.S)[0];
  if(WZ.step===0)return !!c&&(c==='stop'||!!p.risk.trim());
  if(WZ.step===1)return !!p.bias&&!!p.A.it.trim()&&!!p.B.it.trim();
  if(WZ.step===2)return !!p.watch.trim()&&p.ack;return true}
function drawWizard(keepScroll){const c=document.getElementById('content'),y=c.scrollTop;c.innerHTML=wizardPage();if(keepScroll)c.scrollTop=y;else c.scrollTop=0}
function wizardPage(){
  const p=WZ.p,c=light(p.S)[0],stop=c==='stop'&&WZ.step===0;
  const hint=WZ.step===0?(stop?'':'Answer all questions and enter your risk.'):WZ.step===1?'Set a bias and both if-then scenarios.':WZ.step===2?'Write what you watch today and confirm your weak spots.':'';
  return `<div class="wz"><div class="steps">${STEPS.map((s,i)=>`<span class="${i===WZ.step?'on':i<WZ.step?'ok':''}"><i>${i<WZ.step?'✓':i+1}</i> ${s}</span>`).join('')}</div>

      ${stop?'<button type="button" class="btn primary" data-wfinish="stop">No trade today · save</button>':WZ.step<3?`<button type="button" class="btn primary" data-wnav="1" ${stepOk()?'':'disabled'}>Continue</button>`:'<button type="button" class="btn primary" data-wfinish>Start the day</button>'}</span></div></div>`;
}
function finishWizard(stop){const d=day(WZ.k);if(stop&&!(d.trades||[]).length)d.session='faded';WZ.p.done=true;WZ.p.stopped=!!stop;d.plan=WZ.p;const k=WZ.k;syncDay(k);persist();WZ=null;
  toast(stop?'Saved. No trade today, journal instead.':'Day started. Trade your plan.');if(location.hash!=='#day-'+k)location.hash='day-'+k;else render()}
function addShots(key,files){[...files].filter(f=>f&&f.type.startsWith('image/')).forEach(file=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const s=Math.min(1,1600/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    if(!WZ)return;const du=c.toDataURL('image/jpeg',.82),w=WZ;upShot(du).then(u=>{if(WZ!==w)return;(w.p.shots[key]=w.p.shots[key]||[]).push(u);drawWizard(true);toast('Screenshot added')})};img.src=url})}

/* ---- Day page ---- */

/* Session: was a no-trade day a deliberate fade at the chart, or were you not there at all? */
let pendingAway=null;
function sessionCard(k){const d=day(k),n=d.trades.length,v=n?'traded':d.session||'';
  const L={traded:'Traded',faded:'Faded the day',away:'Not at the chart'},sub={traded:'Scored by your rules',faded:'At the chart, no trade on purpose',away:'Deletes this day, no entry'};
  const opt=key=>{const dis=n&&key!=='traded';if(key==='away'&&pendingAway===k)return `<button type="button" class="sp-o danger" data-session="away"><b>Delete this day?</b><small>Click again to remove it from journal and calendar</small></button>`;
    return `<button type="button" class="sp-o ${v===key?'on':''}" data-session="${key}" ${dis?'disabled':''}><b>${L[key]}</b><small>${dis?'This day has trades':sub[key]}</small></button>`};
  return `<div class="sp-pick${pendingAway===k?' open':''}"><button type="button" class="sp-cur" data-sptoggle aria-haspopup="true"><span class="sp-l">Session</span><span>${v?L[v]:'Not set'}</span><svg class="chev2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="sp-menu" role="menu">${opt('traded')}${opt('faded')}${opt('away')}</div></div>`;
}
function dayPage(k){
  const d=day(k),s=statusOf(k)||'open',ks=keys(),i=ks.indexOf(k),r=dayR(k),br=broken(k),n=d.trades.length;
  const prev=ks.filter(x=>x<k).at(-1),nxt=ks.filter(x=>x>k)[0];
  const nav=`<div class="pager">${prev?`<a href="#day-${prev}">← ${esc(fmt(prev,{day:'numeric',month:'short'}))}</a>`:'<span>←</span>'}${nxt?`<a href="#day-${nxt}">${esc(fmt(nxt,{day:'numeric',month:'short'}))} →</a>`:'<span>→</span>'}</div>`;
  const RK=R(k),set=RK.filter(([id])=>d.rules[id]!=null).length;
  const prov=k===todayKey&&!d.ended&&(s==='win'||s==='nt');
  const head=s==='win'?label(k)+(prov?' so far':''):s==='nt'?'No-trade day'+(prov?' so far':''):s==='loss'?'Rule break':'Open day';
  const sub=(s==='open'&&!d.trades.length&&!d.session)?'No trade logged. Tell NQ Desk how the session went: add your trades, or mark the day as faded on purpose.':prov?'Provisional until you end the day. Nothing broken yet.':s==='win'?'No rule broken. The result does not count here.':s==='nt'?'All rules kept, no trade taken. Not scored: no-trade days do not count toward your streak or win rate.':s==='loss'?`${br.length} ${br.length>1?'rules':'rule'} broken: ${br.map(x=>x[1]).join(', ')}`:`Tick your rules after the session (${set}/${RK.length} set). All kept = Psych Win.`;
  const trades=(n?`<div class="trades">${d.trades.map((t,j)=>`<a class="tr" href="#trade-${k}-${j+1}"><span class="tnum">${esc(t.time)}</span><span class="dir">${esc(t.dir)}</span><span>${esc(t.setup)}</span><span class="r tnum ${rCls(t.r)}">${fmtR(+t.r||0)}</span><span class="pill ${tBad(t)?'loss':'win'}">${t.broke.length?'Rule break':tBad(t)?'Off-strategy':'Rules kept'}</span><span class="go" aria-hidden="true">›</span></a>`).join('')}</div>`:'<p class="none">No trade on this day.</p>')
    +`<form class="addtr" data-addtr="${k}"><input class="in" name="time" placeholder="09:45" aria-label="Time (ET)" required pattern="\\d{1,2}:\\d{2}"><select class="in" name="dir" aria-label="Direction"><option>Long</option><option>Short</option></select><select class="in" name="setup" aria-label="Setup">${setupOpts('')}</select><input class="in" name="r" placeholder="R, e.g. −1" aria-label="Result in R" required><button type="submit" class="btn sm">+ Add trade</button></form>`;
  const rules=rulesList(k)+`<div class="rules-foot"><span>✓ kept · ✕ broken · click again to clear. <b>auto</b> = checked from your trades and plan.</span><button type="button" class="btn sm" data-allkept="${k}">All rules kept</button></div>`;
  return `<div class="col">${liveBar(k)}
    <div class="banner ${s}"><div><div class="big">${head}</div><p>${sub}</p>${sessionCard(k)}</div>
      <div class="stats"><div><span>Trades</span><b class="tnum">${n}</b></div><div><span>Result</span><b class="tnum ${rCls(r)}">${n?fmtR(r):'–'}</b></div><div><span>Streak on this day</span><b class="tnum">${s==='open'?'–':streakUpTo(k)}</b></div></div></div>
    <div class="daypage">
      <div class="col">${card('Trades',trades)}${notesCard(k,'day')}</div>
      <div class="col">${card('Rules',rules,'',`<span class="pill ${s==='open'?'':s}">${set}/${RK.length}</span>`)}${postCard(k)}${prePlan(k)}${stratCard(k)}${nav}</div>
    </div>
  </div>`;
}

/* ---- Trade page ---- */
const MOON=ICON+'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function setupOpts(cur){const L=(ST.settings.setups||[]).map(x=>x.name);if(cur&&!L.includes(cur)&&cur!=='No setup')L.push(cur);L.push('No setup');return L.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}
function rulesList(k){const d=day(k),T=d.trades||[];return `<ul class="rl2l">${R(k).map(([id,l])=>{const v=d.rules[id],tb=d.tb&&id in d.tb,au=d.auto?.[id]&&!d.manual?.[id];
  const tw=tb?T.map((t,i)=>(t.broke||[]).includes(id)?`Trade ${i+1} at ${t.time}`:'').filter(Boolean).join(', '):'';const why=tb?'Broken in '+tw:au&&v===false?d.why?.[id]||'':'';
  return `<li class="rl2"><span class="rl-t">${esc(l)}${why?`<small class="neg">${esc(why)}</small>`:''}</span>${tb?'<small class="tag-auto tr">in a trade</small>':au?'<small class="tag-auto">auto</small>':''}<span class="yn"><button type="button" data-rule="${id}" data-v="y" aria-pressed="${v===true}" aria-label="${esc(l)}: kept">✓</button><button type="button" data-rule="${id}" data-v="n" aria-pressed="${v===false}" aria-label="${esc(l)}: broken">✕</button></span></li>`}).join('')}</ul>`}
async function inlineShots(o){for(const d of Object.values(o.days||{})){const sh=d.plan?.shots;if(!sh)continue;for(const key of Object.keys(sh)){const a=sh[key]||[];for(let i=0;i<a.length;i++){const u=String(a[i]);if(u.startsWith('data:'))continue;try{const src=window.NQ_IMGDATA?await NQ_IMGDATA(u):null;if(src){a[i]=src;continue}const b=await (await fetch(u)).blob();a[i]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}catch(_){}}}}return o}
async function saveBackup(){const name='nq-desk-backup-'+todayKey+'.json',data=JSON.stringify(await inlineShots(clone(ST)));const done=()=>{ST.lastBackup=Date.now();persist();rerenderKeepScroll();toast('Backup saved')};
  let dl=null;try{dl=window.claude?.use?await window.claude.use('downloads'):null}catch(_){}
  if(dl){try{await dl.save({filename:name,data});done()}catch(e){toast(e?.code==='declined'?'Backup not saved':'Download is not available here. Use Copy backup in Settings.')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();done()}catch(_){toast('Download was blocked here. Use Copy backup.')}}
function backupRemind(){const own=keys().some(k=>!(k in SAMPLE));if(!own)return '';const lb=ST.lastBackup,days=lb?Math.floor((Date.now()-lb)/864e5):null,lim=CL?30:7;if(lb&&days<lim)return '';if(CL&&!lb&&keys().length<5)return '';

function stratCard(k){const T=day(k).trades||[];if(!T.length)return '';const S=T.map(stratOf),off=S.reduce((a,c)=>a+c.n,0),mis=S.reduce((a,c)=>a+c.m,0),open=S.some(c=>c.open);

/* ---- Analysis helpers shared by Dashboard metrics and Performance ---- */
const num=s=>{const v=parseFloat(String(s??'').replace(/−/g,'-').replace(/[^0-9.\-]/g,''));return isNaN(v)?0:v};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const lastScored=n=>n?scored().slice(-n):scored();
function breakCounts(ks){const c={};ks.forEach(k=>broken(k).forEach(([id,l])=>{c[id]=c[id]||{id,l,n:0,days:[]};c[id].n++;c[id].days.push(k)}));return Object.values(c).sort((a,b)=>b.n-a.n)}
function prevResult(k){const ks=scored(),i=ks.indexOf(k);if(i<1)return null;const p=ks[i-1];if(statusOf(p)==='loss')return'Rule break';const n=(ST.days[p].trades||[]).length;if(!n)return'No trade';return dayR(p)>0?'Win':dayR(p)<0?'Loss':'Breakeven'}
const monthKey=k=>k.slice(0,7);
const brkInMonth=m=>scored().filter(k=>monthKey(k)===m).reduce((n,k)=>n+broken(k).length,0);
const prevMonth=m=>{const[y,mm]=m.split('-').map(Number);const d=new Date(Date.UTC(y,mm-2,1));return d.toISOString().slice(0,7)};

/* ---- Dashboard metrics ---- */

  <div class="kpi"><span class="kpi-l">Psych Win rate</span><div class="kpi-v ${L.length?(w/L.length>=.8?'pos':w/L.length<.6?'neg':''):'muted'}">${L.length?pct(w,L.length)+'<small>%</small>':'–'}</div><div class="kpi-s">${w} of ${L.length} days · last 20</div>

/* Psych Wins over the last 6 weeks: one square per weekday, like a contribution grid */
function psychGrid(){
  const mon=shiftDay(todayKey,-((new Date(todayKey+'T12:00:00Z').getUTCDay()+6)%7)),weeks=[...Array(6)].map((_,i)=>shiftDay(mon,-(5-i)*7));
  const st=k=>k>todayKey?'fut':hasContent(k)?({open:'open',nt:'nt',win:'w',loss:'l'})[statusOf(k)]:'none';
  const all=weeks.flatMap(w=>[0,1,2,3,4].map(d=>shiftDay(w,d))).filter(k=>k<=todayKey),sc=all.filter(k=>['w','l'].includes(st(k))),g=sc.filter(k=>st(k)==='w').length;
  const cell=k=>{const c=st(k),t=`${fmt(k,{weekday:'short',day:'numeric',month:'short'})}: ${c==='w'?label(k):c==='nt'?'No-trade day':c==='l'?'Rule break':c==='open'?'Open':c==='fut'?'Upcoming':'No entry'}`;
    return c==='fut'?`<span class="pg fut" title="${esc(t)}"></span>`:`<a class="pg ${c}${k===todayKey?' td':''}" href="#day-${k}" title="${esc(t)}" aria-label="${esc(t)}"></a>`};
  return card('Psych Wins · 6 weeks',`<div class="pg-top"><div><b class="${sc.length?(g===sc.length?'pos':g/sc.length<.6?'neg':''):''}">${sc.length?g+'/'+sc.length:'–'}</b><span>days without a rule break</span></div><div><b>${streak()}</b><span>current streak</span></div></div>
    <div class="pg-grid"><span></span>${weeks.map(w=>`<span class="pg-w">${esc(fmt(w,{day:'numeric',month:'short'}))}</span>`).join('')}
    ${['Mon','Tue','Wed','Thu','Fri'].map((d,i)=>`<span class="pg-d">${d}</span>${weeks.map(w=>cell(shiftDay(w,i))).join('')}`).join('')}</div>
    <div class="pg-leg"><span><i class="pg w"></i>Psych Win</span><span><i class="pg l"></i>Rule break</span><span><i class="pg nt"></i>No trade</span><span><i class="pg none"></i>No entry</span></div>`,'','<a class="link" href="#performance">Performance</a>');
}
function dashBoxes(){
  const L=lastScored(30);
  const bars=L.map(k=>`<a href="#day-${k}" class="vb ${isWin(k)?'w':'l'}" title="${esc(fmt(k,{weekday:'short',day:'numeric',month:'short'}))}: ${label(k)}"></a>`).join('');
  const bc=breakCounts(L),mx=Math.max(bc[0]?.n||1,3);

    ${card('Rule breaks by rule',bc.length?`<div class="hbars">${bc.slice(0,5).map(x=>`<div class="hb"><span>${esc(x.l)}</span><b class="tnum">${x.n}</b><i style="width:${x.n/mx*100}%"></i></div>`).join('')}</div>`:'<p class="none">No rule broken in the last 30 days.</p>')}
    ${card('With and without rule breaks',`<div class="cost"><div><span>Avg day, rules kept</span><b class="${rCls(avg(clean))}">${clean.length?fmtR(avg(clean)):'–'}</b><small>${clean.length} trading days</small></div><div><span>Avg day, rule broken</span><b class="${rCls(avg(dirty))}">${dirty.length?fmtR(avg(dirty)):'–'}</b><small>${dirty.length} trading days</small></div></div>`)}`;

/* ---- Performance: rule breaks, psych and solutions ---- */
function setupStats(name,ks){const T=(ks||keys()).flatMap(k=>(ST.days[k].trades||[]).filter(t=>t.setup===name));return{n:T.length,r:T.reduce((a,t)=>a+(+t.r||0),0),clean:T.filter(t=>!tBad(t)),T}}
let pRange='w',pWeek=0;
function inRange(k){if(pRange==='all')return true;if(pRange==='30')return k>=shiftDay(todayKey,-29);return isoWeek(k)===isoWeek(shiftDay(todayKey,7*pWeek))}
const perfKeys=()=>scored().filter(inRange);
function rateRows(groups){return `<div class="rates">${groups.map(([l,ks])=>{const b=ks.filter(k=>!isWin(k)).length;return `<div class="rt${ks.length?'':' na'}"><span>${esc(l)}</span><span class="bar"><i style="width:${ks.length?pct(b,ks.length):0}%"></i></span><b class="tnum">${ks.length?pct(b,ks.length)+'%':'–'}</b><small class="tnum">${b}/${ks.length}</small></div>`}).join('')}</div>`}
function perfView(){
  const L=perfKeys(),n=L.length,wk=isoWeek(shiftDay(todayKey,7*pWeek));

  const rangeSeg=`<div class="prng">${wnav}<div class="seg">${[['w','Week'],['30','30 days'],['all','All']].map(([v,l])=>`<button type="button" data-prange="${v}" aria-pressed="${pRange===v}">${l}</button>`).join('')}</div></div>`;
  if(!n)return `<div class="perf"><div class="ph-head"><h2 class="pt">Performance</h2>${rangeSeg}</div><div class="empty"><div><b>${pRange==='w'?'No scored days in this week':pRange==='30'?'No scored days in the last 30 days':'No scored days yet'}</b><p>Tick your rules after each session. Performance fills up from there.</p></div></div></div>`;
  const w=L.filter(isWin).length,bc=breakCounts(L),mx=Math.max(bc[0]?.n||1,3),half=Math.floor(n/2),A=L.slice(0,half),B=L.slice(half);
  const trend=id=>{if((bc.find(x=>x.id===id)?.n||0)<3)return['','too few to see a trend'];const a=A.filter(k=>broken(k).some(x=>x[0]===id)).length/(A.length||1),b=B.filter(k=>broken(k).some(x=>x[0]===id)).length/(B.length||1);return b<a?['better','▼ improving']:b>a?['worse','▲ more often']:['','= same']};
  const trades=L.flatMap(k=>(ST.days[k].trades||[]).map(t=>({...t,k})));
  const cleanT=trades.filter(t=>!tBad(t)),dirtyT=trades.filter(t=>tBad(t));
  const sumR=a=>a.reduce((s,t)=>s+(+t.r||0),0);
  const cleanD=L.filter(k=>isWin(k)&&(ST.days[k].trades||[]).length),dirtyD=L.filter(k=>!isWin(k)&&(ST.days[k].trades||[]).length);
  const avgD=a=>a.length?a.reduce((s,k)=>s+dayR(k),0)/a.length:0;
  const by=(f,labels)=>labels.map(l=>[l,L.filter(k=>f(k)===l)]);
  const plan=k=>ST.days[k].plan?.done?ST.days[k].plan:null;
  const lightOf=k=>{const p=plan(k);if(!p)return'No psych check';return({go:'Green · clear',wait:'Yellow · reduced',stop:'Red · no trade'})[light(p.S)[0]]||'No psych check'};
  const sleepOf=k=>{const p=plan(k);if(!p||p.S.sleep==null)return null;return p.S.sleep<=2?'Bad (1–2)':p.S.sleep===3?'Okay (3)':'Good (4–5)'};
  const stressOf=k=>plan(k)?.S?.stress||null;
  const wd=k=>fmt(k,{weekday:'long'});
  const feel=a=>{const c={};a.forEach(t=>{const v=(t.emo?.before||'').trim();if(v)c[v]=(c[v]||0)+1});return Object.entries(c).sort((x,y)=>y[1]-x[1]).slice(0,5)};
  const fd=feel(dirtyT),fc=feel(cleanT);
  const fixes=ST.settings.fixes||(ST.settings.fixes={});
  const lessonOf=k=>{const m=/<blockquote[^>]*>(.*?)<\/blockquote>/i.exec(ST.days[k].note||'');return m?plain(m[1]):''};
  const hd=(t,s,extra='')=>`<div class="bx-h"><h2>${t}</h2>${extra||`<span>${s}</span>`}</div>`;
  return `<div class="perf">
    <div class="ph-head"><div><h2 class="pt">Performance</h2><p class="kpi-s">Based on ${n} scored trading ${n===1?'day':'days'}${(()=>{const t=keys().filter(k=>statusOf(k)==='nt'&&inRange(k)).length;return t?` · ${t} no-trade ${t===1?'day':'days'} not scored`:''})()}${n<20&&pRange!=='w'?'. Under 20 days these numbers are still mostly noise.':'.'}</p></div>${rangeSeg}</div>
    <div class="kpis k4">
      <div class="kpi"><span class="kpi-l">Psych Win rate</span><div class="kpi-v ${w/n>=.8?'pos':w/n<.6?'neg':''}">${pct(w,n)}<small>%</small></div><div class="kpi-s">${w} of ${n} days</div></div>
      <div class="kpi"><span class="kpi-l">Rule breaks</span><div class="kpi-v ${bc.length?'neg':'pos'}">${bc.reduce((s,x)=>s+x.n,0)}</div><div class="kpi-s">on ${n-w} ${n-w===1?'day':'days'}</div></div>
      <div class="kpi"><span class="kpi-l">R from rule-break trades</span><div class="kpi-v ${rCls(sumR(dirtyT))}">${dirtyT.length?fmtR(sumR(dirtyT)):'–'}</div><div class="kpi-s">${dirtyT.length} trades</div></div>
      <div class="kpi"><span class="kpi-l">R from clean trades</span><div class="kpi-v ${rCls(sumR(cleanT))}">${cleanT.length?fmtR(sumR(cleanT)):'–'}</div><div class="kpi-s">${cleanT.length} trades</div></div>
    </div>
    <section class="box">${hd('Which rules you break','')}
      ${bc.length?`<div class="rlb">${bc.map(x=>{const[c,t]=trend(x.id);return `<div class="rb"><div class="rb-l"><b>${esc(x.l)}</b><small>${pct(x.days.length,n)}% of days · <span class="${c==='better'?'pos':c==='worse'?'neg':''}">${t}</span></small></div><span class="bar"><i style="width:${x.n/mx*100}%"></i></span><b class="tnum neg">${x.n}×</b></div>`}).join('')}</div><p class="byline" style="margin-top:12px">Trend compares the first and second half of the range.</p>`:'<p class="none">No rule broken in this range. That is the whole game.</p>'}</section>
    <section class="box">${hd('When you break rules','Share of days with at least one rule break')}

/* ---- Trades: ids, automatic rule checks, rule breaks from trades, kill switch ---- */
const tid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const tMin=t=>{const m=/(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const AUTO_IDS=['max2','stop','done','kz','psych','news','strat'];
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function lightOf(k){const p=ST.days[k]?.plan;return p?.done?light(p.S)[0]:''}
function limits(k){const p=ST.settings.profile,lt=k?lightOf(k):'',maxT=parseInt(p.maxTrades)||2;return{maxT,dayT:lt==='wait'?1:lt==='stop'?0:maxT,maxL:Math.abs(num(p.maxLoss))||2,kzA:tMin(p.kzStart)??570,kzB:tMin(p.kzEnd)??660,lt}}
const ntOf=k=>ST.newsDays&&k in ST.newsDays?ST.newsDays[k]:undefined;
/* objective rules NQ Desk can check from your trades, with the reason */
function autoCheck(k){const d=ST.days[k],T=(d?.trades||[]).slice().sort((a,b)=>a.time.localeCompare(b.time)),res={},why={};if(!T.length){if(d?.session==='faded')res.strat=true;return{res,why}}
  const off=T.map(t=>[t,stratOf(t).off]).filter(x=>x[1].length);res.strat=!off.length;if(off.length)why.strat=off.map(([t,o])=>`${t.time}: ${o.map(x=>x.t).join(', ')}`).join(' · ');
  const L=limits(k);
  res.max2=T.length<=L.maxT;if(!res.max2)why.max2=`${T.length} trades, max is ${L.maxT}. Trade ${L.maxT+1} at ${T[L.maxT].time}`;
  const out=T.find(t=>{const m=tMin(t.time);return m===null||m<L.kzA||m>L.kzB});res.kz=!out;if(out)why.kz=`Trade at ${out.time} is outside ${hm(L.kzA)}–${hm(L.kzB)}`;
  let cum=0,wins=0;res.stop=true;res.done=true;T.forEach(t=>{if(res.stop&&cum<=-L.maxL){res.stop=false;why.stop=`Trade at ${t.time} after the day was already ${fmtR(cum)}`}if(res.done&&(cum>=2||wins>=2)){res.done=false;why.done=`Trade at ${t.time} after ${wins>=2?'2 wins':fmtR(cum)}`}cum+=+t.r||0;if((+t.r||0)>0)wins++});
  if(res.stop&&cum<-L.maxL-0.25){res.stop=false;why.stop=`Day closed at ${fmtR(cum)}, stop is −${L.maxL}R`}
  if(L.lt==='stop'){res.psych=false;why.psych=`Red light in the psych check, trade at ${T[0].time}`}else if(L.lt==='wait'){res.psych=T.length<=1;if(!res.psych)why.psych=`Yellow light allows 1 trade, you took ${T.length}`}else if(L.lt)res.psych=true;
  const nt=ntOf(k);if(nt!==undefined){res.news=!nt;if(nt)why.news=`${nt} day, trade at ${T[0].time}`}
  return{res,why}}
function killState(k){const d=ST.days[k],T=d?.trades||[],L=limits(k),nt=ntOf(k);
  if(L.lt==='stop')return{bad:true,pre:!T.length,why:T.length?'Red light in your psych check, and a trade was taken':'Red light in your psych check'};
  if(nt)return{bad:true,pre:!T.length,why:`${nt} today, a no-trade day`};
  if(!T.length)return null;let cum=0,wins=0;T.forEach(t=>{cum+=+t.r||0;if((+t.r||0)>0)wins++});
  if(cum<=-L.maxL)return{bad:true,why:`Daily stop hit (${fmtR(cum)})`};if(T.length>=L.dayT)return{bad:false,why:`${T.length} of ${L.dayT} ${L.dayT===1?'trade':'trades'} taken${L.lt==='wait'?' (yellow light)':''}`};
  if(cum>=2)return{bad:false,why:`+${cum.toFixed(1)}R reached`};if(wins>=2)return{bad:false,why:'2 wins taken'};return null}
/* keep day rules in step with trades: automatic checks first, then rule breaks you marked inside a trade */
function syncDay(k){const d=ST.days[k];if(!d)return;d.auto=d.auto||{};d.manual=d.manual||{};d.tb=d.tb||{};
  const active=new Set(R(k).map(x=>x[0])),{res:ac,why}=autoCheck(k);d.why={};
  AUTO_IDS.forEach(id=>{if(!active.has(id)||d.manual[id])return;if(id in ac){d.rules[id]=ac[id];d.auto[id]=true;if(why[id])d.why[id]=why[id]}else if(d.auto[id]){delete d.rules[id];delete d.auto[id]}});
  const broken=new Set((d.trades||[]).flatMap(t=>t.broke||[]));
  broken.forEach(id=>{if(!(id in d.tb))d.tb[id]=d.rules[id]===undefined?null:d.rules[id];d.rules[id]=false});
  Object.keys(d.tb).forEach(id=>{if(!broken.has(id)){const pv=d.tb[id];delete d.tb[id];if(d.auto[id]&&id in ac)d.rules[id]=ac[id];else if(pv===null)delete d.rules[id];else d.rules[id]=pv}});
}
/* today's live strip: kill switch, otherwise what the plan allows; plus a break after a loss */
function sessionBar(k){const d=ST.days[k],L=limits(k);if(!d?.plan?.done)return '';const T=d.trades||[],cum=T.reduce((a,t)=>a+(+t.r||0),0),risk=d.plan.risk||ST.settings.profile.risk||'';
  const half=L.lt==='wait'&&num(risk)?' → half: $'+Math.round(num(risk)/2):'';
  const left=L.maxL+cum;
  return `<div class="sbar"><span class="light ${L.lt}">${L.lt==='go'?'Green':'Yellow'}</span><span>Max <b>${L.dayT}</b> ${L.dayT===1?'trade':'trades'}</span><span>1R <b>${esc(risk||'–')}${half}</b></span><span><b>${T.length}</b> taken${T.length?' · '+fmtR(cum):''}</span><span><b>${left>0?left.toFixed(1)+'R':'0R'}</b> left to the daily stop</span></div>`}
function pauseBar(k){const T=ST.days[k]?.trades||[],last=T.filter(t=>t.at).sort((a,b)=>b.at-a.at)[0];if(!last||(+last.r||0)>=0)return '';
  const until=last.at+(parseInt(ST.settings.profile.pause)||15)*60000;if(until<=Date.now())return '';
  return `<div class="pause" data-until="${until}"><b>Break</b><span class="cd">${cdTxt(until)}</span><span class="pz-t">Stop hit. Away from the screen. The next trade needs the full plan.</span></div>`}
const cdTxt=u=>{const s=Math.max(0,Math.round((u-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
setInterval(()=>document.querySelectorAll('.pause[data-until]').forEach(el=>{const u=+el.dataset.until;if(u<=Date.now()){el.classList.add('over');el.innerHTML='<b>Break over</b><span class="pz-t">Only the full plan gets a next trade.</span>';el.removeAttribute('data-until')}else el.querySelector('.cd').textContent=cdTxt(u)}),1000);
function liveBar(k){if(k!==todayKey)return '';const x=killState(k);return (x?killBar(k):sessionBar(k))+(x?.bad?'':pauseBar(k))}
/* strategy: rules for every trade + the checklist of the trade's setup. y = met, n = broken on purpose, m = misread */
const STRAT_DEFAULT=[{id:'g-bias',t:'Bias matches the higher timeframe'},{id:'g-conf',t:'Entry only after confirmation, nothing anticipated'},{id:'g-stop',t:'Stop behind the swing'},{id:'g-tgt',t:'Target is the DOL'}];
function stratItems(t){const S=ST.settings,su=(S.setups||[]).find(x=>x.name===t.setup);
  return [...(S.strategy||[]).filter(x=>x.t).map(x=>({key:'g:'+x.id,t:x.t,grp:'Every trade'})),...(su?su.check.map((c,i)=>({key:'s'+i,t:c,grp:su.name})).filter(x=>x.t):[])]}
function stratOf(t){const I=stratItems(t),m=t.strat||{};const c={y:0,n:0,m:0,open:0,total:I.length};I.forEach(x=>{const v=m[x.key];if(v)c[v]++;else c.open++});c.off=I.filter(x=>m[x.key]==='n');return c}
const tBad=t=>(t.broke||[]).length>0||Object.values(t.strat||{}).includes('n');
const tradeIndex=(k,id)=>(ST.days[k]?.trades||[]).findIndex(t=>t.id===id)+1;
function sortTrades(k){ST.days[k].trades.sort((a,b)=>a.time.localeCompare(b.time))}
/* one-time upgrade of stored data */
function upgradeStore(){
  Object.values(ST.days).forEach(d=>(d.trades||[]).forEach(t=>{if(!t.id)t.id=tid()}));
  (ST.folders||[]).forEach(f=>f.items=f.items.map(r=>{const m=/^t:(\d{4}-\d{2}-\d{2})\|(\d+)$/.exec(r);if(!m)return r;const t=ST.days[m[1]]?.trades?.[+m[2]-1];return t?`t:${m[1]}|${t.id}`:r}));
  const S=ST.settings;
  S.emotions=S.emotions||['Calm','Focused','Patient','Confident','Impatient','FOMO','Revenge','Fear','Bored','Overconfident'];
  S.setups=S.setups||[{id:'s-ts',name:'Turtle Soup',check:['Level marked before the open','Fast displacement leg into the level','Sweep and close back inside','Entry on close of the Turtle Soup candle']},
    {id:'s-fvg',name:'First FVG',check:['Bias and DOL clear','First presented FVG after the open','Entry inside the FVG, stop at swing']},
    {id:'s-disp',name:'Displacement',check:['Displacement through a key level','Pullback into the leg','Target is the DOL']}];
  if(!ST.accounts||ST.acctSeeded!==1){ST.accounts=(ST.accounts||[]).concat([
    {id:'a-sample1',sample:true,firm:'Lucid',name:'50K Flex',type:'Funded',status:'Active',cost:'$270',balance:'$51,240',floor:'$49,000',bestDay:'$620',profit:'$1,240',cons:'40',payouts:'$0'},
    {id:'a-sample2',sample:true,firm:'Lucid',name:'50K Pro',type:'Eval',status:'Blown',cost:'$150',balance:'$47,950',floor:'$48,000',bestDay:'$410',profit:'$0',cons:'40',payouts:'$0'}]);ST.acctSeeded=1}
  Object.keys(SAMPLE).forEach(k=>{if(ST.days[k]?.trades?.length)syncDay(k)});
