<!DOCTYPE html><html><head><meta charset="utf-8"><title>tv test</title></head><body style="margin:0;font-family:sans-serif">
<div id="w"></div>
<script>
const cands=["CME_MINI:NQ1!","CME_MINI:ES1!","FOREXCOM:NSXUSD","FOREXCOM:SPXUSD","NASDAQ:NDX","SP:SPX","CAPITALCOM:US100","PEPPERSTONE:NAS100","OANDA:NAS100USD","TVC:DXY","CAPITALCOM:DXY","TVC:US10Y","TVC:VIX","CAPITALCOM:VIX","TVC:USOIL","OANDA:XAUUSD","TVC:GOLD","FX:EURUSD","BITSTAMP:BTCUSD","AMEX:QQQ","NASDAQ:QQQ"];
const box=document.getElementById('w');
cands.forEach(s=>{const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;border-bottom:1px solid #ddd;height:48px';
 const l=document.createElement('div');l.textContent=s;l.style.cssText='width:220px;font-size:13px;padding-left:8px';row.appendChild(l);
 const c=document.createElement('div');c.className='tradingview-widget-container';c.style.width='600px';const i=document.createElement('div');i.className='tradingview-widget-container__widget';c.appendChild(i);
 const sc=document.createElement('script');sc.src='https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';sc.async=true;sc.textContent=JSON.stringify({symbol:s,width:'100%',isTransparent:true,colorTheme:'light',locale:'en'});c.appendChild(sc);row.appendChild(c);box.appendChild(row)});
</script></body></html>
